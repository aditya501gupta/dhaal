name: Build DHAAL Android APK

# Builds an installable debug APK on every push to the android project, and
# attaches it to a GitHub Release so it can be downloaded straight to a phone.
on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:      # lets you build on demand from the Actions tab

permissions:
  contents: write         # needed to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/DHAAL.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DHAAL-apk
          path: out/DHAAL.apk

      # A tagged push (v*) also publishes a downloadable Release with the APK.
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/DHAAL.apk
