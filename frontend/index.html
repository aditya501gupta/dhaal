<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DHAAL — your shield against scams</title>
<meta name="theme-color" content="#1f3864">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DHAAL">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
  :root { --navy:#1f3864; --navy-soft:#2e5aa8; --red:#b91c1c; --amber:#b45309; --green:#15803d; --bg:#f4f6fb; --card:#fff; --ink:#16181d; --muted:#5b6472; --line:#dde4f0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", "Noto Sans Bengali", "Noto Sans Tamil", "Noto Sans Telugu", sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:760px; margin:0 auto; padding:20px 16px 80px; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:6px 0 18px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand-badge { width:40px; height:40px; border-radius:12px; background:var(--navy); color:#fff; display:grid; place-items:center; font-size:20px; }
  .brand h1 { font-size:1.28rem; color:var(--navy); letter-spacing:.4px; }
  .brand small { display:block; color:var(--muted); font-weight:400; font-size:.72rem; margin-top:1px; }
  .lang-sel { border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:8px 12px; font-size:.85rem; font-weight:600; color:var(--navy); cursor:pointer; font-family:inherit; }
  .hero { text-align:center; margin:8px 0 18px; }
  .hero h2 { font-size:1.45rem; color:var(--navy); line-height:1.3; }
  .hero p { color:var(--muted); margin-top:6px; font-size:.95rem; }
  .input-card { background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:14px; box-shadow:0 2px 12px rgba(20,40,80,.06); }
  textarea { width:100%; min-height:130px; border:none; outline:none; font-size:1.02rem; line-height:1.55; resize:vertical; font-family:inherit; background:transparent; }
  .input-actions { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; }
  .btn { border:0; border-radius:12px; padding:13px 20px; font-size:1rem; font-weight:700; cursor:pointer; transition:transform .05s ease; }
  .btn:active { transform:scale(.98); }
  .btn-primary { background:var(--navy); color:#fff; flex:1; min-width:160px; }
  .btn-primary:disabled { opacity:.6; }
  .btn-ghost { background:#e8edf7; color:var(--navy); }
  .btn-ocr { background:#eaf0fb; color:var(--navy); border:1.5px dashed var(--navy-soft); }
  .verdict-card { margin-top:18px; background:var(--card); border-radius:16px; padding:20px; box-shadow:0 3px 16px rgba(20,40,80,.09); border-top:6px solid var(--line); display:none; }
  .verdict-card.SCAM { border-top-color:var(--red); }
  .verdict-card.SUSPICIOUS { border-top-color:var(--amber); }
  .verdict-card.SAFE { border-top-color:var(--green); }
  .verdict-head { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .verdict-label { font-size:1.5rem; font-weight:800; }
  .SCAM .verdict-label { color:var(--red); }
  .SUSPICIOUS .verdict-label { color:var(--amber); }
  .SAFE .verdict-label { color:var(--green); }
  .verdict-type { color:var(--muted); font-weight:600; font-size:.95rem; text-transform:capitalize; }
  .confidence { margin-left:auto; font-size:.82rem; color:var(--muted); }
  .section-label { margin:16px 0 6px; font-size:.78rem; font-weight:700; letter-spacing:.8px; color:var(--muted); text-transform:uppercase; }
  .anatomy { background:#fafbfe; border:1px solid var(--line); border-radius:12px; padding:13px; line-height:1.7; white-space:pre-wrap; font-size:.97rem; }
  .anatomy mark { background:#fde3e3; color:#8f1d1d; border-radius:4px; padding:0 3px; font-weight:700; }
  .tags { display:flex; flex-wrap:wrap; gap:8px; }
  .tag { background:#eef2fb; color:var(--navy); font-size:.8rem; padding:6px 11px; border-radius:999px; font-weight:600; }
  .explain { color:#333; line-height:1.6; font-size:.97rem; }
  .citation { font-size:.88rem; color:#444; border-left:3px solid var(--navy); padding:6px 0 6px 12px; margin-top:8px; line-height:1.55; background:#fbfcff; border-radius:0 8px 8px 0; }
  .citation b { color:var(--navy); }
  .action-row { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .btn-action { background:#fff; border:1.5px solid var(--navy); color:var(--navy); border-radius:12px; padding:11px 16px; font-weight:700; font-size:.9rem; cursor:pointer; }
  .btn-danger { background:var(--red); border-color:var(--red); color:#fff; }
  .meta-line { margin-top:14px; font-size:.75rem; color:#98a1af; }
  .ocr-status { margin-top:8px; font-size:.82rem; color:var(--navy-soft); font-weight:600; display:none; }
  .samples { margin-top:26px; }
  .samples h3 { font-size:.85rem; color:var(--muted); margin-bottom:8px; font-weight:600; }
  .chip { display:inline-block; background:#fff; border:1px solid var(--line); border-radius:999px; padding:8px 13px; margin:4px 6px 0 0; font-size:.84rem; cursor:pointer; color:var(--ink); }
  .chip:hover { border-color:var(--navy-soft); }
  .trust-strip { margin-top:34px; text-align:center; color:var(--muted); font-size:.8rem; line-height:1.7; }
  .trust-strip b { color:var(--navy); }
  .complaint-box { margin-top:12px; background:#fffdf5; border:1.5px dashed var(--amber); border-radius:12px; padding:13px; font-size:.88rem; line-height:1.6; white-space:pre-wrap; cursor:pointer; display:none; }
  .btn-guard { background:#fdecec; color:var(--red); border:1.5px solid var(--red); }
  .guard-overlay { position:fixed; inset:0; background:#0d1b33; color:#fff; z-index:9999; display:none; flex-direction:column; padding:22px 20px; }
  .guard-overlay.on { display:flex; }
  .guard-overlay.state-caution { background:#7a4a08; }
  .guard-overlay.state-alert { animation:guardpulse 1s infinite; }
  @keyframes guardpulse { 0%,100%{ background:#8f1414; } 50%{ background:#c81e1e; } }
  .guard-top { display:flex; justify-content:space-between; align-items:center; }
  .guard-state { font-size:1.05rem; font-weight:800; letter-spacing:1.2px; }
  .guard-stop { background:#fff; color:#0d1b33; border:0; border-radius:999px; padding:10px 18px; font-weight:700; cursor:pointer; font-family:inherit; }
  .guard-big { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:14px; }
  .guard-icon { font-size:4rem; }
  .guard-headline { font-size:1.75rem; font-weight:800; line-height:1.25; }
  .guard-sub { font-size:1.02rem; opacity:.93; max-width:520px; line-height:1.5; }
  .guard-transcript { background:rgba(255,255,255,.10); border-radius:14px; padding:14px; font-size:.95rem; line-height:1.6; max-height:30vh; overflow:auto; }
  .guard-transcript .live { opacity:.55; }
  .guard-hint { text-align:center; font-size:.78rem; opacity:.7; margin-top:10px; }
  /* menu + overlays */
  .icon-btn { border:1.5px solid var(--line); background:#fff; border-radius:10px; width:40px; height:40px; font-size:1.1rem; cursor:pointer; color:var(--navy); }
  .sheet { position:fixed; inset:0; background:rgba(10,20,40,.55); z-index:9000; display:none; align-items:flex-end; }
  .sheet.on { display:flex; }
  .sheet-card { background:#fff; width:100%; max-width:760px; margin:0 auto; border-radius:20px 20px 0 0; padding:20px 18px 26px; max-height:92vh; overflow:auto; }
  .sheet-card h3 { color:var(--navy); font-size:1.15rem; margin-bottom:4px; }
  .sheet-card .sub { color:var(--muted); font-size:.88rem; margin-bottom:14px; line-height:1.5; }
  .perm { display:flex; gap:11px; align-items:flex-start; background:#f7f9fd; border:1px solid var(--line); border-radius:12px; padding:11px 12px; margin-bottom:9px; }
  .perm .pi { font-size:1.25rem; }
  .perm .pt { font-weight:700; color:var(--ink); font-size:.92rem; }
  .perm .pd { color:var(--muted); font-size:.8rem; line-height:1.45; margin-top:2px; }
  .switch { margin-left:auto; flex:none; width:44px; height:26px; border-radius:999px; background:#cbd5e6; position:relative; cursor:pointer; transition:background .15s; border:0; }
  .switch.on { background:var(--green); }
  .switch::after { content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .15s; }
  .switch.on::after { left:21px; }
  .never { background:#f4faf6; border:1px solid #cdeBD8; border-left:3px solid var(--green); border-radius:10px; padding:11px 12px; font-size:.83rem; color:#2b5a3c; line-height:1.55; margin-top:6px; }
  .never b { color:var(--green); }
  .field { width:100%; border:1.5px solid var(--line); border-radius:11px; padding:11px 12px; font-size:1rem; font-family:inherit; margin-top:8px; }
  .row-set { display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); }
  .row-set .rt { font-weight:600; color:var(--ink); font-size:.94rem; }
  .row-set .rd { color:var(--muted); font-size:.78rem; margin-top:1px; }
  .galert-card.SCAM { border-top:6px solid var(--red); }
  .galert-msg { background:#fff8f8; border:1.5px dashed var(--red); border-radius:12px; padding:12px; font-size:.9rem; line-height:1.55; white-space:pre-wrap; margin:10px 0; }
  .big-btn { display:block; width:100%; text-align:center; border:0; border-radius:12px; padding:14px; font-size:1rem; font-weight:700; cursor:pointer; margin-top:9px; }
  .bb-green { background:#1faa53; color:#fff; } .bb-navy { background:var(--navy); color:#fff; } .bb-ghost { background:#eef2fb; color:var(--navy); }
  /* elderly mode */
  body.xl { font-size:1.18rem; }
  body.xl .hero h2 { font-size:1.85rem; } body.xl .btn { padding:17px 22px; font-size:1.15rem; }
  body.xl .verdict-label { font-size:1.9rem; } body.xl .explain, body.xl .anatomy { font-size:1.12rem; }
  body.xl .chip { font-size:1rem; padding:11px 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="brand-badge">&#128737;&#65039;</div>
      <h1>DHAAL<small id="tagline"></small></h1>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <select class="lang-sel" id="langSel" onchange="setLang(this.value)"></select>
      <button class="icon-btn" id="menuBtn" onclick="openSettings()" aria-label="Settings">&#9881;</button>
    </div>
  </div>

  <div class="hero">
    <h2 id="heroTitle"></h2>
    <p id="heroSub"></p>
  </div>

  <div class="input-card">
    <textarea id="txt"></textarea>
    <div class="input-actions">
      <button class="btn btn-primary" id="scanBtn" onclick="scan()"></button>
      <button class="btn btn-ocr" id="ocrBtn" onclick="pickImage()"></button>
      <button class="btn btn-guard" id="guardBtn" onclick="startGuard()"></button>
      <button class="btn btn-ghost" id="clearBtn" onclick="clearAll()"></button>
    </div>
    <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="handleImage(event)">
    <div class="ocr-status" id="ocrStatus"></div>
  </div>

  <div class="verdict-card" id="card">
    <div class="verdict-head">
      <span class="verdict-label" id="vlabel"></span>
      <span class="verdict-type" id="vtype"></span>
      <span class="confidence" id="vconf"></span>
    </div>
    <div id="anatomyWrap">
      <div class="section-label" id="lblAnatomy"></div>
      <div class="anatomy" id="anatomy"></div>
      <div class="section-label" id="lblTactics"></div>
      <div class="tags" id="tags"></div>
    </div>
    <div class="section-label" id="lblWhy"></div>
    <div class="explain" id="explain"></div>
    <div id="citeWrap">
      <div class="section-label" id="lblAuth"></div>
      <div id="cite"></div>
    </div>
    <div id="actionWrap">
      <div class="section-label" id="lblActions"></div>
      <div class="action-row">
        <button class="btn-action btn-danger" id="reportBtn" onclick="toggleComplaint()"></button>
        <button class="btn-action" id="shareBtn" onclick="shareWarning()"></button>
      </div>
      <div class="complaint-box" id="complaint" onclick="copyComplaint()"></div>
    </div>
    <div class="meta-line" id="meta"></div>
  </div>

  <div class="samples">
    <h3 id="tryReal"></h3>
    <div id="chips"></div>
  </div>

  <div class="trust-strip" id="trust"></div>
</div>

<div class="guard-overlay" id="guardOverlay">
  <div class="guard-top">
    <span class="guard-state" id="guardState"></span>
    <button class="guard-stop" id="guardStopBtn" onclick="stopGuard()"></button>
  </div>
  <div class="guard-big">
    <div class="guard-icon" id="guardIcon">🎧</div>
    <div class="guard-headline" id="guardHeadline"></div>
    <div class="guard-sub" id="guardSub"></div>
  </div>
  <div class="guard-transcript" id="guardTranscript"></div>
  <div class="guard-hint" id="guardHint"></div>
</div>

<!-- consent onboarding -->
<div class="sheet" id="consentSheet">
  <div class="sheet-card">
    <h3 id="cs_title"></h3>
    <div class="sub" id="cs_sub"></div>
    <div id="cs_perms"></div>
    <div class="never" id="cs_never"></div>
    <button class="big-btn bb-green" id="cs_agree" onclick="giveConsent()"></button>
    <button class="big-btn bb-ghost" id="cs_later" onclick="closeConsent()"></button>
  </div>
</div>

<!-- settings -->
<div class="sheet" id="setSheet">
  <div class="sheet-card">
    <h3 id="set_title"></h3>
    <div class="sub" id="set_sub"></div>
    <div class="row-set">
      <div><div class="rt" id="set_master_t"></div><div class="rd" id="set_master_d"></div></div>
      <button class="switch on" id="sw_master" onclick="toggleMaster()"></button>
    </div>
    <div class="row-set">
      <div><div class="rt" id="set_xl_t"></div><div class="rd" id="set_xl_d"></div></div>
      <button class="switch" id="sw_xl" onclick="toggleXL()"></button>
    </div>
    <div style="padding:12px 0 2px">
      <div class="rt" id="set_g_t"></div>
      <div class="rd" id="set_g_d" style="margin-bottom:2px"></div>
      <input class="field" id="g_name" placeholder="">
      <input class="field" id="g_phone" inputmode="tel" placeholder="">
      <button class="big-btn bb-navy" id="g_save" onclick="saveGuardian()"></button>
    </div>
    <button class="big-btn bb-ghost" id="set_review" onclick="openConsent(true)"></button>
    <button class="big-btn bb-ghost" id="set_close" onclick="closeSettings()"></button>
  </div>
</div>

<!-- guardian alert -->
<div class="sheet" id="galertSheet">
  <div class="sheet-card galert-card SCAM">
    <h3 id="ga_title"></h3>
    <div class="sub" id="ga_sub"></div>
    <div class="galert-msg" id="ga_msg"></div>
    <button class="big-btn bb-green" id="ga_send" onclick="sendGuardian()"></button>
    <button class="big-btn bb-navy" id="ga_call" onclick="callGuardian()"></button>
    <button class="big-btn bb-ghost" id="ga_close" onclick="closeGalert()"></button>
  </div>
</div>

function t() { return STR[lang]; }

function buildLangSelect() {
  const sel = document.getElementById("langSel");
  sel.innerHTML = "";
  LANG_ORDER.forEach(function (code) {
    const o = document.createElement("option");
    o.value = code;
    o.textContent = STR[code].name;
    sel.appendChild(o);

}

function applyLang() {
  const s = t();

}

function setLang(code) { lang = code; applyLang(); }

function renderChips() {
  const box = document.getElementById("chips");
  box.innerHTML = "";
  SAMPLES.forEach(function (sm) {
    const el = document.createElement("span");
    el.className = "chip";
    el.textContent = sm.label;
    el.onclick = function () { document.getElementById("txt").value = sm.text; scan(); };
    box.appendChild(el);
  });
}

function clearAll() {
  document.getElementById("txt").value = "";
  document.getElementById("card").style.display = "none";
  document.getElementById("ocrStatus").style.display = "none";
  last = null;
}

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function highlight(text, tactics) {
  const spans = [];
  const groups = Object.values(tactics || {});
  for (const arr of groups) for (const sp of arr) spans.push(sp);
  spans.sort(function (a, b) { return a.start - b.start; });
  let out = "", pos = 0;
  for (const sp of spans) {
    if (sp.start < pos) continue;
    out += esc(text.slice(pos, sp.start)) + "<mark>" + esc(text.slice(sp.start, sp.end)) + "</mark>";
    pos = sp.end;
  }
  return out + esc(text.slice(pos));
}

function pickImage() { document.getElementById("imgInput").click(); }

async function handleImage(ev) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const status = document.getElementById("ocrStatus");
  status.style.display = "block";
  status.textContent = t().ocrReading;
  try {
    const res = await Tesseract.recognize(file, "eng");
    const text = (res.data.text || "").replace(/\s+\n/g, "\n").trim();
    if (!text) { status.textContent = t().ocrEmpty; return; }
    document.getElementById("txt").value = text;
    status.textContent = t().ocrDone;
    await scan("screenshot");
    setTimeout(function () { status.style.display = "none"; }, 1200);
  } catch (e) {
    status.textContent = t().ocrEmpty;
  }
  ev.target.value = "";
}

async function scan(channel) {
  const text = document.getElementById("txt").value.trim();
  if (!text) return;
  const card = document.getElementById("card");
  card.className = "verdict-card";
  card.style.display = "block";
  document.getElementById("vlabel").textContent = t().scanning;
  document.getElementById("vtype").textContent = "";
  document.getElementById("vconf").textContent = "";
  document.getElementById("anatomyWrap").style.display = "none";
  document.getElementById("citeWrap").style.display = "none";
  document.getElementById("actionWrap").style.display = "none";
  document.getElementById("explain").textContent = "";
  document.getElementById("meta").textContent = "";
  document.getElementById("complaint").style.display = "none";
  try {
    const resp = await fetch(API + "/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text, channel: (typeof channel === "string" ? channel : "paste") })
    });
    if (!resp.ok) throw new Error("http " + resp.status);
    const r = await resp.json();
    r._input = text;
    last = r;
    render(r);
    maybeGuardianAlert(r);
  } catch (e) {
    document.getElementById("vlabel").textContent = t().apiDown;
  }
}

function render(r) {
  const card = document.getElementById("card");
  card.className = "verdict-card " + r.verdict;
  const icon = r.verdict === "SCAM" ? "🚨" : r.verdict === "SUSPICIOUS" ? "⚠️" : "✅";
  const vword = (t().verdicts && t().verdicts[r.verdict]) || r.verdict;
  document.getElementById("vlabel").textContent = icon + " " + vword;
  document.getElementById("vtype").textContent = (r.scam_type && r.scam_type !== "none" && r.scam_type !== "unknown") ? r.scam_type.replace(/_/g, " ") : "";
  document.getElementById("vconf").textContent = Math.round(r.confidence * 100) + "% · " + r.latency_ms + " ms";

  const hasTactics = r.tactics && Object.keys(r.tactics).length > 0;
  document.getElementById("anatomyWrap").style.display = hasTactics ? "block" : "none";
  if (hasTactics) {
    document.getElementById("anatomy").innerHTML = highlight(r._input, r.tactics);
    document.getElementById("tags").innerHTML = Object.keys(r.tactics).map(function (k) {
      return '<span class="tag">' + esc(k.replace(/_/g, " ")) + "</span>";
    }).join("");
  }

  document.getElementById("explain").textContent = r.explanation || "";

  const cites = r.citations || [];
  document.getElementById("citeWrap").style.display = cites.length ? "block" : "none";
  document.getElementById("cite").innerHTML = cites.map(function (c) {
    return '<div class="citation"><b>' + esc(c.source) + ":</b> " + esc(c.point) + "</div>";
  }).join("");

  document.getElementById("actionWrap").style.display = (r.verdict !== "SAFE") ? "block" : "none";

  document.getElementById("meta").textContent = "engine " + r.engine + " · agent trace: intake → forensics → verdict → guardian";
}

function complaintText() {
  const r = last;
  let tpl = document.getElementById("complaintTpl").textContent;
  const type = String(r.scam_type || "unknown").replace(/_/g, " ");
  const tactics = Object.keys(r.tactics || {}).join(", ") || "-";
  return tpl
    .split("{TYPE}").join(type)
    .split("{DATE}").join(new Date().toLocaleString("en-IN"))
    .split("{VERDICT}").join(r.verdict)
    .split("{CONF}").join(Math.round(r.confidence * 100))
    .split("{TACTICS}").join(tactics)
    .split("{TEXT}").join(r._input);
}

function toggleComplaint() {

  box.textContent = t().complaintTitle + "\n\n" + complaintText();
  box.style.display = "block";

function copyComplaint() {
  navigator.clipboard.writeText(complaintText());
  flash(t().copied);
}

function shareWarning() {
  const r = last;
  const vword = (t().verdicts && t().verdicts[r.verdict]) || r.verdict;
  const msg = t().shareTpl.split("{V}").join(vword).split("{C}").join(Math.round(r.confidence * 100));
  if (navigator.share) { navigator.share({ text: msg }).catch(function () {}); }
  else { navigator.clipboard.writeText(msg); flash(t().copied); }

function flash(text) {

let recog = null, guardState = "idle", fullTranscript = "", lastAnalyzed = "", analyzeTimer = null, guardBusy = false;

function gstr() { return G[lang] || G.en; }

function applyGuardLang() {
  const btn = document.getElementById("guardBtn");
  if (btn) btn.textContent = gstr().btn;
  const stop = document.getElementById("guardStopBtn");
  if (stop) stop.textContent = gstr().stop;
  const hint = document.getElementById("guardHint");
  if (hint) hint.textContent = gstr().hint;
}

function startGuard() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert(gstr().unsupported); return; }
  fullTranscript = ""; lastAnalyzed = "";
  document.getElementById("guardTranscript").innerHTML = "<span class='live'>" + esc(gstr().empty) + "</span>";
  document.getElementById("guardOverlay").classList.add("on");
  setGuardState("watch");
  recog = new SR();
  recog.lang = SPEECH_LOCALE[lang] || "en-IN";
  recog.continuous = true;
  recog.interimResults = true;
  recog.onresult = onSpeech;
  recog.onerror = function () {};
  recog.onend = function () {
    if (document.getElementById("guardOverlay").classList.contains("on")) {
      try { recog.start(); } catch (e) {}
    }
  };
  try { recog.start(); } catch (e) {}
}

function stopGuard() {
  const ov = document.getElementById("guardOverlay");
  ov.classList.remove("on", "state-caution", "state-alert");
  guardState = "idle";
  if (recog) { recog.onend = null; try { recog.stop(); } catch (e) {} recog = null; }
  if (analyzeTimer) { clearTimeout(analyzeTimer); analyzeTimer = null; }
  try { window.speechSynthesis.cancel(); } catch (e) {}
}

function onSpeech(ev) {
  let finalTxt = "", interim = "";
  for (let i = ev.resultIndex; i < ev.results.length; i++) {
    const tr = ev.results[i];
    if (tr.isFinal) finalTxt += tr[0].transcript + " "; else interim += tr[0].transcript;
  }
  if (finalTxt) fullTranscript += finalTxt;
  const box = document.getElementById("guardTranscript");
  box.innerHTML = esc(fullTranscript) + "<span class='live'>" + esc(interim) + "</span>";
  box.scrollTop = box.scrollHeight;
  scheduleAnalyze();
}

function scheduleAnalyze() {
  if (analyzeTimer) return;
  analyzeTimer = setTimeout(function () { analyzeTimer = null; runGuardAnalyze(); }, 2500);
}

async function runGuardAnalyze() {
  const win = fullTranscript.slice(-600).trim();
  if (!win || win === lastAnalyzed || guardBusy) return;
  guardBusy = true; lastAnalyzed = win;
  try {
    const resp = await fetch(API + "/analyze", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: win, channel: "call" })
    });
    if (resp.ok) {
      const r = await resp.json();
      if (r.verdict === "SCAM") setGuardState("alert", r);
      else if (r.verdict === "SUSPICIOUS" && guardState !== "alert") setGuardState("caution", r);
    }
  } catch (e) {}
  guardBusy = false;
}

function setGuardState(state, r) {
  const prev = guardState;
  guardState = state;
  const ov = document.getElementById("guardOverlay");
  ov.classList.remove("state-caution", "state-alert");
  const g = gstr();
  const st = document.getElementById("guardState");
  const icon = document.getElementById("guardIcon");
  const head = document.getElementById("guardHeadline");
  const sub = document.getElementById("guardSub");
  if (state === "alert") {
    ov.classList.add("state-alert");
    st.textContent = g.listening + " · ALERT";
    icon.textContent = "🚨"; head.textContent = g.alertHead; sub.textContent = g.alertSub;
    if (prev !== "alert") {
      try { if (navigator.vibrate) navigator.vibrate([400, 150, 400, 150, 600]); } catch (e) {}
      speak(g.spoken);
    }
  } else if (state === "caution") {
    ov.classList.add("state-caution");
    st.textContent = g.listening + " · CAUTION";
    icon.textContent = "⚠️"; head.textContent = g.caution; sub.textContent = "";
  } else {
    st.textContent = g.listening;
    icon.textContent = "🎧"; head.textContent = g.watch; sub.textContent = "";
  }
}

function speak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = SPEECH_LOCALE[lang] || "en-IN";
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

function isNativeApp() { return nativeBridge() !== null; }
function openConsent(review) {
  document.getElementById("cs_title").textContent = tk("consentTitle");
  document.getElementById("cs_sub").textContent = tk("consentSub");
  const perms = [tk("permMic"), tk("permNoti"), tk("permSms"), tk("permCall")];
  document.getElementById("cs_perms").innerHTML = perms.map(function (p) {
    return '<div class="perm"><div class="pi">' + p[0] + '</div><div><div class="pt">' + esc(p[1]) + '</div><div class="pd">' + esc(p[2]) + '</div></div></div>';
  }).join("");
  document.getElementById("cs_never").innerHTML = tk("never");
  document.getElementById("cs_agree").textContent = tk("agree");
  document.getElementById("cs_later").textContent = tk("later");
  document.getElementById("cs_later").style.display = review ? "none" : "block";
  document.getElementById("consentSheet").classList.add("on");
}
function giveConsent() { LS.setItem("dhaal_consent", "1"); closeConsent(); try { if ("Notification" in window && Notification.permission === "default") Notification.requestPermission(); } catch (e) {} }
function closeConsent() { document.getElementById("consentSheet").classList.remove("on"); }
function openSettings() {
  const g = getGuardian() || {};
  document.getElementById("set_title").textContent = tk("setTitle");
  document.getElementById("set_sub").textContent = tk("setSub");
  document.getElementById("set_master_t").textContent = tk("masterT");
  document.getElementById("set_master_d").textContent = tk("masterD");
  document.getElementById("set_xl_t").textContent = tk("xlT");
  document.getElementById("set_xl_d").textContent = tk("xlD");
  document.getElementById("set_g_t").textContent = tk("gT");
  document.getElementById("set_g_d").textContent = tk("gD");
  document.getElementById("g_name").placeholder = tk("gName");
  document.getElementById("g_phone").placeholder = tk("gPhone");
  document.getElementById("g_name").value = g.name || "";
  document.getElementById("g_phone").value = g.phone || "";
  document.getElementById("g_save").textContent = tk("gSave");
  document.getElementById("set_review").textContent = tk("review");
  document.getElementById("set_close").textContent = tk("close");
  document.getElementById("sw_master").className = "switch" + (LS.getItem("dhaal_master") !== "0" ? " on" : "");
  document.getElementById("sw_xl").className = "switch" + (LS.getItem("dhaal_xl") === "1" ? " on" : "");
  document.getElementById("setSheet").classList.add("on");
}
function closeSettings() { document.getElementById("setSheet").classList.remove("on"); }
function toggleMaster() { const on = LS.getItem("dhaal_master") !== "0"; LS.setItem("dhaal_master", on ? "0" : "1"); document.getElementById("sw_master").className = "switch" + (!on ? " on" : ""); const nb = nativeBridge(); if (nb) { try { if (on) { nb.disableSmsGuard(); } else { nb.enableSmsGuard(); } } catch (e) {} } }
function toggleXL() { const on = LS.getItem("dhaal_xl") === "1"; LS.setItem("dhaal_xl", on ? "0" : "1"); applyXL(); document.getElementById("sw_xl").className = "switch" + (!on ? " on" : ""); }
function applyXL() { document.body.classList.toggle("xl", LS.getItem("dhaal_xl") === "1"); }
function saveGuardian() {
  const g = { name: document.getElementById("g_name").value.trim(), phone: document.getElementById("g_phone").value.replace(/[^0-9]/g, "") };
  LS.setItem("dhaal_guardian", JSON.stringify(g));
  // On the native app: hand the guardian to the native layer and turn on the
  // background SMS shield (this triggers the OS SMS-permission prompt).
  const nb = nativeBridge();
  if (nb && g.phone) { try { nb.setGuardian(g.name, g.phone); nb.enableSmsGuard(); } catch (e) {} }
  const b = document.getElementById("g_save"), o = b.textContent; b.textContent = tk("saved");
  setTimeout(function () { b.textContent = o; }, 1400);
}
function guardianMsg(r) {
  const g = getGuardian() || {}, type = String(r.scam_type || "unknown").replace(/_/g, " ");
  return tk("gaMsg").split("{T}").join(type).split("{C}").join(Math.round(r.confidence * 100)).split("{N}").join(g.name || "them");
}
function maybeGuardianAlert(r) {
  if (!r || r.verdict !== "SCAM") return;
  if (LS.getItem("dhaal_master") === "0") return;
  const g = getGuardian(); if (!g || !g.phone) return;
  document.getElementById("ga_title").textContent = tk("gaTitle");
  document.getElementById("ga_sub").textContent = tk("gaSub");
  document.getElementById("ga_msg").textContent = guardianMsg(r);
  document.getElementById("ga_send").textContent = tk("gaSend");
  document.getElementById("ga_call").textContent = tk("gaCall");
  document.getElementById("ga_close").textContent = tk("gaClose");
  document.getElementById("galertSheet").classList.add("on");
  try { if (navigator.vibrate) navigator.vibrate([300, 120, 300]); } catch (e) {}
}
function sendGuardian() { const g = getGuardian() || {}; window.open("https://wa.me/" + g.phone + "?text=" + encodeURIComponent(guardianMsg(last)), "_blank"); }
function callGuardian() { const g = getGuardian() || {}; location.href = "tel:" + g.phone; }
function closeGalert() { document.getElementById("galertSheet").classList.remove("on"); }

buildLangSelect();
applyLang();
renderChips();
applyXL();
if (!LS.getItem("dhaal_consent")) openConsent(false);
if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("/sw.js"); } catch (e) {} }
</script>
</body>
</html>
